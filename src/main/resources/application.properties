# Server
server.port=8080
server.servlet.context-path=/

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/portal
spring.datasource.username=portal_user
spring.datasource.password=portal_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=your-super-secret-jwt-key-that-should-be-at-least-256-bits-long-for-hs512
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.company.portal=DEBUG
