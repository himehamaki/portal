spring.application.name=portal

# ========== Server Configuration ==========
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# ========== Database Configuration ==========
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portal_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:portal_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:portal_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========== JPA/Hibernate Configuration ==========
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ========== File Upload Configuration ==========
file.upload-dir=${FILE_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ========== JWT Configuration ==========
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ========== Logging Configuration ==========
logging.level.root=INFO
logging.level.com.company.portal=DEBUG
