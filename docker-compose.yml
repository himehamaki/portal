version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: portal-postgres
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal_user
      POSTGRES_PASSWORD: portal_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/portal
      SPRING_DATASOURCE_USERNAME: portal_user
      SPRING_DATASOURCE_PASSWORD: portal_password
      JWT_SECRET: your-super-secret-jwt-key-that-should-be-at-least-256-bits-long-for-hs512
      JWT_EXPIRATION: 86400000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./target:/app/target

  frontend:
    image: node:18-alpine
    container_name: portal-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev
    environment:
      - VITE_API_URL=http://localhost:8080

volumes:
  postgres_data:
